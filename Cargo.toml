[workspace]
members = [".", "tests/cfg_test_crate"]

[package]
name = "disjoint_impls"
version = "1.4.3"
edition = "2024"
license = "Apache-2.0"
authors = ["Marin Veršić <marin.versic101@gmail.com>"]
repository = "https://github.com/mversic/disjoint_impls"
description = "Support for mutually disjoint impls"
keywords = ["disjoint", "exclusive", "associated", "impl", "implementation"]

[lib]
proc-macro = true

[dependencies]
syn = {version = "3.0.9", features = ["full", "extra-traits", "visit", "visit-mut"]}
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
itertools = "0.15.0"
indexmap = "2.14.2"
manyhow = "0.14.1"
quote = "1.0.47"

[dev-dependencies]
remote_trait = { path = "tests/remote_trait" }

trybuild = "1.0.121"
